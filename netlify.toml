[build]
  publish = "."
  command = "python3 tools/build_index.py"

# clang/lld (~50MB) удаан ачаалагддаг тул хөтөчид 30 хоног кэшлүүлнэ.
# Хөрвүүлэгчийг шинэчилбэл bin/ хавтасны нэрийг солих (жишээ нь bin-v2/) эсвэл энэ хугацааг багасга.
[[headers]]
  for = "/judge/bin/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/judge/bin/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/problems/index.json"
  [headers.values]
    Cache-Control = "no-cache"
